<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Produk · Gpayment Store</title>
<style>
  :root{--bg:#07111f;--card:#15243a;--card2:#1b2f4c;--line:#3c5573;--txt:#f5f7fb;--mut:#9db1c7;--acc:#4f8cff;--green:#55e6a5;--red:#ff6b6b;--gold:#ffd166;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}
  .brand{font-weight:700} .brand span{color:var(--mut);font-weight:400}
  main{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
  h2{margin-bottom:16px}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .btn:hover{filter:brightness(1.1)}
  .btn.green{background:var(--green);color:#062}
  .btn.red{background:var(--red)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.full{width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:700}
  .tag{font-size:11px;text-transform:uppercase;padding:2px 8px;border-radius:6px;font-weight:600}
  .tag.akun{background:rgba(255,209,102,.15);color:var(--gold)}
  .tag.link{background:rgba(79,140,255,.15);color:var(--acc)}
  .tag.file{background:rgba(85,230,165,.15);color:var(--green)}
  .muted{color:var(--mut);font-size:13px}
  .price{color:var(--green);font-weight:700}
  .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .form label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  .form input,.form select,.form textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--txt);font-size:13px}
  .form textarea{min-height:60px;font-family:monospace}
  .hidden{display:none!important}
  .err{background:rgba(255,107,107,.12);border:1px solid var(--red);color:var(--red);padding:10px;border-radius:8px;margin:10px 0}
  .ok{background:rgba(85,230,165,.12);border:1px solid var(--green);color:var(--green);padding:10px;border-radius:8px;margin:10px 0}
  .acc-list{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
  .acc-item{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
  .acc-item.sold{opacity:.5}
  .acc-item pre{white-space:pre-wrap;word-break:break-all;flex:1}
  .nav a{color:var(--acc);text-decoration:none;margin-left:12px;font-size:13px}
  .nav a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="brand">🛍️ Manajemen Produk <span>· Gpayment Store</span></div>
  <div class="nav">
    <a href="/" target="_blank">Lihat Store</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <button class="btn green" onclick="showForm()">+ Tambah Produk</button>
    <button class="btn ghost" onclick="load()">↻ Refresh</button>
  </div>
  <div id="msg"></div>
  <div id="list"><div class="muted">Memuat...</div></div>
</main>

<div id="formModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto">
  <div style="max-width:560px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px">
    <h3 id="formTitle">Tambah Produk</h3>
    <div class="form" id="formBody"></div>
  </div>
</div>

<script>
const $ = s=>document.querySelector(s);
async function api(url,opts){
  const r = await fetch(url, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'Request gagal');
  return j;
}
async function needAuth(){ try{ const r=await fetch('/api/admin?action=verify'); return r.ok; }catch(e){ return false; } }
function showLogin(){
  $('#list').innerHTML=`<div class="card" style="max-width:360px;margin:40px auto;text-align:center">
    <h3 style="margin-bottom:8px">🔐 Login Admin</h3>
    <p class="muted">Masuk untuk kelola produk & stok akun.</p>
    <div class="form" style="margin-top:14px"><input type="password" id="admPass" placeholder="Password admin" style="text-align:center">
    <button class="btn green full" onclick="doLogin()">Masuk</button></div></div>`;
}
async function doLogin(){
  try{
    await api('/api/admin?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#admPass').value})});
    msg('Berhasil masuk',true); load();
  }catch(e){ msg(e.message); }
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function msg(t,ok){ $('#msg').innerHTML = `<div class="${ok?'ok':'err'}">${esc(t)}</div>`; setTimeout(()=>$('#msg').innerHTML='',4000); }

async function load(){
  if(!(await needAuth())) return showLogin();
  try{
    const {products} = await api('/api/admin-products?action=list');
    const list = $('#list');
    if(!products.length){ list.innerHTML='<div class="muted">Belum ada produk. Tambah via tombol di atas.</div>'; return; }
    list.innerHTML = products.map(p=>`
      <div class="card">
        <div class="top">
          <div>
            <div class="name">${esc(p.name)}</div>
            <div class="muted">${p.type==='akun'?('Stok: <b>'+p.stock+'</b>'):(p.type==='link'?'Link':'File')}</div>
          </div>
          <div>
            <span class="tag ${p.type}">${p.type}</span>
            <span class="price" style="margin-left:10px">${fmt(p.price)}</span>
            ${p.active?'' : '<span class="tag" style="background:rgba(255,107,107,.15);color:var(--red);margin-left:6px">off</span>'}
          </div>
        </div>
        <div class="actions">
          <button class="btn" onclick="showForm('${p.id}')">✏️ Edit</button>
          ${p.type==='akun'?`<button class="btn ghost" onclick="showAccounts('${p.id}')">👥 Kelola Akun</button>`:''}
          <button class="btn red" onclick="del('${p.id}')">🗑️ Hapus</button>
        </div>
      </div>`).join('');
  }catch(e){ $('#list').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

function showForm(id){
  $('#formTitle').textContent = id?'Edit Produk':'Tambah Produk';
  $('#formBody').innerHTML = `
    <label>Nama Produk</label><input id="f_name">
    <label>Deskripsi</label><textarea id="f_desc"></textarea>
    <label>Harga (IDR)</label><input id="f_price" type="number" min="1">
    <label>Tipe</label><select id="f_type"><option value="akun">Akun (random)</option><option value="link">Link</option><option value="file">File</option></select>
    <div id="f_typeExtra"></div>
    <label>Gambar URL (opsional)</label><input id="f_image">
    <label>Kategori (opsional)</label><input id="f_cat">
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn green" onclick="save('${id||''}')">💾 Simpan</button>
      <button class="btn ghost" onclick="closeForm()">Batal</button>
    </div>`;
  $('#f_type').onchange = typeExtra;
  $('#formModal').classList.remove('hidden');
  if(id){
    api('/api/admin-products?action=get&id='+encodeURIComponent(id)).then(({product:p})=>{
      $('#f_name').value=p.name; $('#f_desc').value=p.description||''; $('#f_price').value=p.price;
      $('#f_type').value=p.type; $('#f_image').value=p.image||''; $('#f_cat').value=p.category||'';
      typeExtra();
      if(p.type==='link') $('#f_link').value=p.link||'';
      if(p.type==='file'){ $('#f_fileUrl').value=p.fileUrl||''; $('#f_fileName').value=p.fileName||''; }
    }).catch(e=>msg(e.message));
  } else typeExtra();
}
function typeExtra(){
  const t=$('#f_type').value;
  $('#f_typeExtra').innerHTML = t==='link'
    ? '<label>Target URL (MediaFire/Drive/dll)</label><input id="f_link">'
    : t==='file'
      ? '<label>File URL</label><input id="f_fileUrl"><label>Nama File</label><input id="f_fileName">'
      : '<label style="color:var(--green)">Akun dikelola lewat "Kelola Akun" setelah produk dibuat</label>';
}
async function save(id){
  const body = { id: id||undefined, name:$('#f_name').value, description:$('#f_desc').value, price:$('#f_price').value, type:$('#f_type').value, image:$('#f_image').value, category:$('#f_cat').value };
  const t=body.type;
  if(t==='link') body.link=$('#f_link').value;
  if(t==='file'){ body.fileUrl=$('#f_fileUrl').value; body.fileName=$('#f_fileName').value; }
  try{ await api('/api/admin-products?action='+(id?'update':'create'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); msg('Tersimpan!',true); closeForm(); load(); }
  catch(e){ msg(e.message); }
}
function closeForm(){ $('#formModal').classList.add('hidden'); }
async function del(id){
  if(!confirm('Hapus produk ini?')) return;
  try{ await api('/api/admin-products?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); msg('Dihapus',true); load(); }catch(e){ msg(e.message); }
}
function showAccounts(pid){
  $('#formTitle').textContent='Kelola Stok Akun';
  $('#formBody').innerHTML = `<label>Akun baru (1 per baris; format: email:password atau bebas)</label>
    <textarea id="accBulk" rows="6" placeholder="user@ff.example.com:pass123&#10;user2@ff.example.com:pass456"></textarea>
    <button class="btn green" onclick="addAccs('${pid}')">➕ Tambah Akun</button>
    <div id="accList"></div>
    <button class="btn ghost" style="margin-top:10px" onclick="closeForm()">Tutup</button>`;
  $('#formModal').classList.remove('hidden');
  loadAccs(pid);
}
async function loadAccs(pid){
  try{
    const {product:p}=await api('/api/admin-products?action=get&id='+encodeURIComponent(pid));
    const items=p._items||[];
    $('#accList').innerHTML = `<p class="muted" style="margin-top:12px">Jumlah akun: ${(p._items||[]).length}</p>
      <div class="acc-list">${items.length?items.map(i=>`<div class="acc-item ${i.sold?'sold':''}"><pre>${esc(i.content)}</pre><span class="muted">${i.sold?'✔ terjual':'tersedia'}</span>${i.sold?'':`<button class="btn red" style="padding:3px 8px;font-size:11px" onclick="rmAcc('${pid}','${i.id}')">hapus</button>`}</div>`).join(''):'<div class="muted acc-item">Belum ada akun</div>'}</div>`;
  }catch(e){ $('#accList').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function addAccs(pid){
  const text=$('#accBulk').value;
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){msg('Isi minimal 1 akun');return;}
  try{ const r=await api('/api/admin-products?action=add-accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:pid,accounts:lines})}); msg(`+${r.added} akun ditambahkan`,true); loadAccs(pid); }catch(e){msg(e.message);}
}
async function rmAcc(pid,iid){
  try{ await api('/api/admin-products?action=remove-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:pid,itemId:iid})}); loadAccs(pid); }catch(e){msg(e.message);}
}
async function logout(){ await api('/api/admin?action=logout',{method:'POST'}).catch(()=>{}); location.reload(); }
load();
</script>
</body>
</html>
